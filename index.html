// ADMIN: MANAGE AGENT REQUESTS & REFERRALS
// ═══════════════════════════════════════════════════════════════════════════════
async function loadAgentRequests(){
    const c=document.getElementById('adm-requests');
    c.innerHTML='<p style="text-align:center;color:#999;padding:20px">Loading...</p>';
    try{
    const reqSnap=await db.collection('agent_requests').get();
    const refSnap=await db.collection('referrals').get();

    let html=`<div class="card"><h2>🙋 Agent Requests</h2>`;
    const requests=[];reqSnap.forEach(doc=>requests.push({id:doc.id,...doc.data()}));
    requests.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    const pending=requests.filter(r=>r.status==='pending');
    const processed=requests.filter(r=>r.status!=='pending');

    if(!pending.length) html+='<p class="note">No pending agent requests.</p>';
    pending.forEach(r=>{
        html+=`<div class="order-card pending"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px">
            <div><b>${r.name}</b><br><span style="font-size:10px;color:var(--muted)">${r.email} | ${r.phone||'—'}</span><br><span style="font-size:11px">"${r.reason}"</span></div>
            <div><button class="btn btn-success btn-sm" onclick="approveAgentRequest('${r.id}','${r.uid}')">✓ Approve</button> <button class="btn btn-danger btn-sm" onclick="rejectAgentRequest('${r.id}')">✕ Reject</button></div>
        </div><p style="font-size:10px;color:var(--muted);margin-top:4px">${new Date(r.createdAt).toLocaleString()}</p></div>`;
    });
    if(processed.length){
        html+='<h3 style="font-size:11px;color:var(--muted);margin-top:12px">Past Requests:</h3>';
        processed.slice(0,10).forEach(r=>{
            const badge=r.status==='approved'?'<span class="badge b-active">Approved</span>':'<span class="badge b-blocked">Rejected</span>';
            html+=`<div class="cart-item"><div><b>${r.name}</b> ${badge}<br><span style="font-size:10px;color:var(--muted)">${r.email}</span></div></div>`;
        });
    }
    html+=`</div>`;

    // Referrals
    html+=`<div class="card"><h2>🤝 Referrals</h2>`;
    const referrals=[];refSnap.forEach(doc=>referrals.push({id:doc.id,...doc.data()}));
    referrals.sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    if(!referrals.length) html+='<p class="note">No referrals yet.</p>';
    referrals.forEach(r=>{
        const badge=r.status==='contacted'?'<span class="badge b-active">Contacted</span>':'<span class="badge b-pending">Pending</span>';
        html+=`<div class="cart-item"><div><b>${r.refName}</b> (referred as ${r.refType}) ${badge}<br><span style="font-size:10px;color:var(--muted)">By: ${r.referrerName} | Phone: ${r.refPhone||'—'} | ${new Date(r.createdAt).toLocaleDateString()}</span></div>
        <div><button class="btn btn-sm btn-success" onclick="markReferralContacted('${r.id}')">✓ Contacted</button></div></div>`;
    });
    html+=`</div>`;

    // Agent Subscription Management
    html+=`<div class="card"><h2>💳 Membership & Subscriptions</h2>
        <p class="note" style="margin-bottom:8px">Manage plans for agents/members: Free Trial (1 month) → Paid → Gold (Lifetime). You can also promote members to agents here.</p>`;
    const allUsersSnap=await db.collection('shop_users').get();
    const nonAdminUsers=[];
    allUsersSnap.forEach(doc=>{const u=doc.data();if(u.role!=='admin')nonAdminUsers.push({id:doc.id,...u});});
    nonAdminUsers.sort((a,b)=>(a.role==='agent'?0:1)-(b.role==='agent'?0:1));
    if(!nonAdminUsers.length) html+='<p class="note">No users found.</p>';
    nonAdminUsers.forEach(a=>{
        const plan=a.agentPlan||'none';
        const roleBadge=a.role==='agent'?'<span class="badge b-agent">Agent</span>':'<span class="badge b-active">Member</span>';
        const planBadge=plan==='gold'?'<span class="badge" style="background:#FFF8E1;color:#F57F17">⭐ GOLD</span>':plan==='paid'?'<span class="badge b-active">Paid</span>':plan==='free_trial'?'<span class="badge b-pending">Free Trial</span>':'<span class="badge" style="background:#f5f5f5;color:#999">No Plan</span>';
        const trialEnd=a.trialEndDate?new Date(a.trialEndDate).toLocaleDateString():'—';
        html+=`<div class="cart-item" style="flex-wrap:wrap"><div><b>${a.name}</b> ${roleBadge} ${planBadge}<br><span style="font-size:10px;color:var(--muted)">${a.email} | ${a.phone||'—'} | Trial ends: ${trialEnd}</span></div>
        <div style="display:flex;gap:4px;flex-wrap:wrap">
            ${a.role==='member'?`<button class="btn btn-sm btn-primary" onclick="promoteToAgent('${a.id}')">↑ Make Agent</button>`:''}
            <button class="btn btn-sm btn-outline" onclick="setAgentPlan('${a.id}','free_trial')">Trial</button>
            <button class="btn btn-sm btn-success" onclick="setAgentPlan('${a.id}','paid')">Paid</button>
            <button class="btn btn-sm btn-accent" onclick="setAgentPlan('${a.id}','gold')">⭐ Gold</button>
        </div></div>`;
    });
    html+=`</div>`;
    c.innerHTML=html;
    }catch(e){console.error('loadAgentRequests error:',e);c.innerHTML=`<div class="card"><h2>🙋 Requests & Subscriptions</h2><p class="msg msg-err">Error loading: ${e.message}</p><p class="note" style="margin-top:8px">If you see "Missing permissions", add these Firestore rules:<br><code>match /agent_requests/{docId} { allow read, write: if isLoggedIn(); }</code><br><code>match /referrals/{docId} { allow read, write: if isLoggedIn(); }</code></p></div>`;}
}

async function promoteToAgent(uid){
    if(!confirm('Promote this member to Agent role?')) return;
    const trialEnd=new Date();trialEnd.setMonth(trialEnd.getMonth()+1);
    await db.collection('shop_users').doc(uid).update({role:'agent',agentPlan:'free_trial',trialStartDate:new Date().toISOString(),trialEndDate:trialEnd.toISOString()});
    alert('✅ Promoted to Agent with 1-month free trial!');
    loadAgentRequests();
}

async function approveAgentRequest(reqId,uid){
    if(!confirm('Approve this user as Agent?')) return;
    await db.collection('agent_requests').doc(reqId).update({status:'approved',approvedAt:new Date().toISOString()});
    // Set trial dates
    const trialEnd=new Date();trialEnd.setMonth(trialEnd.getMonth()+1);
    await db.collection('shop_users').doc(uid).update({role:'agent',agentPlan:'free_trial',trialStartDate:new Date().toISOString(),trialEndDate:trialEnd.toISOString()});
    alert('✅ User promoted to Agent with 1-month free trial!');
    loadAgentRequests();
}

async function rejectAgentRequest(reqId){
    await db.collection('agent_requests').doc(reqId).update({status:'rejected',rejectedAt:new Date().toISOString()});
    alert('Request rejected.');loadAgentRequests();
}

async function markReferralContacted(refId){
    await db.collection('referrals').doc(refId).update({status:'contacted',contactedAt:new Date().toISOString()});
    loadAgentRequests();
}

async function setAgentPlan(uid,plan){
    const updates={agentPlan:plan};
    if(plan==='free_trial'){const end=new Date();end.setMonth(end.getMonth()+1);updates.trialStartDate=new Date().toISOString();updates.trialEndDate=end.toISOString();}
    if(plan==='gold'){updates.goldSince=new Date().toISOString();updates.trialEndDate='';}
    if(plan==='paid'){updates.paidSince=new Date().toISOString();}
    await db.collection('shop_users').doc(uid).update(updates);
    alert('Plan updated to: '+plan.toUpperCase());
    loadAgentRequests();
}

// ═══════════════════════════════════════════════════════════════════════════════
// DELETE FINANCE ENTRY (generic)
// ═══════════════════════════════════════════════════════════════════════════════
async function delFinEntry(id,cid,shopId,type){
    if(!confirm('Delete this entry?')) return;
    if(type==='sale') await db.collection('shop_accounts').doc(id).delete();
    else if(type==='expense') await db.collection('shop_accounts').doc(id).delete();
    else if(type==='saving') await db.collection('shop_savings').doc(id).delete();
    else if(type==='bill') await db.collection('shop_bills').doc(id).delete();
    // Reload the appropriate section
    if(type==='sale') loadDailySales(cid,shopId);
    else if(type==='expense') loadSmartExpenses(cid,shopId);
    else if(type==='saving') loadSavingsManager(cid,shopId);
    else if(type==='bill') loadMonthlyBills(cid,shopId);
}
