<!DOCTYPE html>
<html>
<head><title>Generate ShopManager Icons</title></head>
<body style="padding:20px;font-family:sans-serif">
<h2>ShopManager Icon Generator</h2>
<p>Right-click each image and "Save image as" to save the icons.</p>

<h3>192x192</h3>
<canvas id="c192" width="192" height="192"></canvas>

<h3>512x512</h3>
<canvas id="c512" width="512" height="512"></canvas>

<script>
function drawIcon(canvas){
    const ctx=canvas.getContext('2d');
    const s=canvas.width;
    // Background
    ctx.fillStyle='#1B5E20';
    ctx.beginPath();
    ctx.roundRect(0,0,s,s,s*0.2);
    ctx.fill();
    
    // Shopping bag
    const cx=s/2, cy=s*0.52;
    const bw=s*0.45, bh=s*0.42;
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.roundRect(cx-bw/2, cy-bh/2+s*0.05, bw, bh, s*0.04);
    ctx.fill();
    
    // Bag handle
    ctx.strokeStyle='#fff';
    ctx.lineWidth=s*0.04;
    ctx.lineCap='round';
    ctx.beginPath();
    ctx.arc(cx, cy-bh/2+s*0.05, s*0.1, Math.PI, 0);
    ctx.stroke();
    
    // Chart bars inside bag
    const barW=s*0.06;
    const baseY=cy+bh/2-s*0.02;
    ctx.fillStyle='#1B5E20';
    ctx.fillRect(cx-s*0.13, baseY-s*0.08, barW, s*0.08);
    ctx.fillStyle='#2E7D32';
    ctx.fillRect(cx-s*0.04, baseY-s*0.14, barW, s*0.14);
    ctx.fillStyle='#4CAF50';
    ctx.fillRect(cx+s*0.05, baseY-s*0.2, barW, s*0.2);
    
    // Arrow up
    ctx.strokeStyle='#FF6F00';
    ctx.lineWidth=s*0.03;
    ctx.beginPath();
    ctx.moveTo(cx-s*0.1, baseY-s*0.05);
    ctx.lineTo(cx+s*0.1, baseY-s*0.22);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx+s*0.04, baseY-s*0.22);
    ctx.lineTo(cx+s*0.1, baseY-s*0.22);
    ctx.lineTo(cx+s*0.1, baseY-s*0.16);
    ctx.stroke();
    
    // Text "SM" at top
    ctx.fillStyle='#FFD700';
    ctx.font=`bold ${s*0.12}px sans-serif`;
    ctx.textAlign='center';
    ctx.fillText('SM', cx, s*0.18);
}

drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));

// Auto-download links
['c192','c512'].forEach(id=>{
    const canvas=document.getElementById(id);
    const link=document.createElement('a');
    link.download=id==='c192'?'icon-192.png':'icon-512.png';
    link.href=canvas.toDataURL('image/png');
    const btn=document.createElement('button');
    btn.textContent='Download '+link.download;
    btn.style.cssText='margin:8px;padding:8px 16px;background:#1B5E20;color:#fff;border:none;border-radius:6px;cursor:pointer';
    btn.onclick=()=>link.click();
    canvas.parentNode.insertBefore(btn,canvas.nextSibling);
});
</script>
</body>
</html>
